<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل العمل اليومي — إدارة التنويم</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#F0F4F8;padding:16px;direction:rtl;color:#333;font-size:13px;max-width:580px;margin:0 auto}
.header{background:linear-gradient(135deg,#185FA5,#0C447C);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;display:flex;align-items:center;gap:12px;box-shadow:0 4px 15px rgba(24,95,165,0.3)}
.logo-box{background:#fff;border-radius:8px;padding:6px 10px;height:44px;display:flex;align-items:center;flex-shrink:0}
.logo-box img{height:30px;width:auto}
.hdr-info{color:#fff}
.hdr-title{font-size:15px;font-weight:700}
.hdr-sub{font-size:11px;color:#B5D4F4;margin-top:2px}
.card{background:#fff;border-radius:10px;padding:1rem 1.1rem;margin-bottom:10px;border:0.5px solid #e0e0e0}
.card-title{font-size:12px;font-weight:700;color:#185FA5;margin-bottom:.875rem;padding-bottom:.5rem;border-bottom:1.5px solid #E6F1FB;display:flex;align-items:center;gap:6px}
.field{margin-bottom:12px}
.field label{font-size:11px;color:#555;display:block;margin-bottom:4px;font-weight:700}
.field input,.field select,.field textarea{width:100%;font-size:12px;padding:8px 10px;border:0.5px solid #ddd;border-radius:7px;background:#fff;font-family:Arial;direction:rtl;transition:border-color 0.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#185FA5;outline:none;box-shadow:0 0 0 3px rgba(24,95,165,0.1)}
.field textarea{height:56px;resize:none}
.req{color:#E24B4A}
.date-chip{display:inline-block;background:#E6F1FB;color:#185FA5;border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;margin-bottom:10px}
.checkbox-group{display:flex;flex-direction:column;gap:6px}
.checkbox-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#444;cursor:pointer;padding:6px 8px;border-radius:7px;border:0.5px solid #eee;background:#fff;transition:all 0.15s}
.checkbox-item:hover{background:#E6F1FB;border-color:#185FA5}
.checkbox-item input{width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:#185FA5}
.complaint-section{background:#FFF8F8;border-radius:8px;padding:0;margin-bottom:8px;border:0.5px solid #FECACA;overflow:hidden}
.complaint-header{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;cursor:pointer;background:#FFF0F0}
.complaint-type{font-size:12px;font-weight:700;color:#8B1A1A}
.complaint-badge{background:#E24B4A;color:#fff;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700}
.complaint-body{padding:.75rem 1rem;border-top:0.5px solid #FECACA;display:none}
.complaint-body.open{display:block}
.add-complaint-btn{width:100%;background:#FFF0F0;border:1.5px dashed #FECACA;border-radius:8px;padding:10px;font-size:12px;cursor:pointer;color:#E24B4A;font-family:Arial;font-weight:700;margin-bottom:10px;transition:all 0.2s}
.add-complaint-btn:hover{background:#FDECEA;border-color:#E24B4A}
.remove-btn{background:transparent;border:none;color:#E24B4A;font-size:16px;cursor:pointer;padding:0 4px}
.sub-field{margin-bottom:8px}
.sub-field label{font-size:10px;color:#666;display:block;margin-bottom:3px;font-weight:700}
.sub-field select,.sub-field input,.sub-field textarea{width:100%;font-size:11px;padding:6px 8px;border:0.5px solid #ddd;border-radius:6px;font-family:Arial;direction:rtl;background:#fff}
.sub-field textarea{height:46px;resize:none}
.star-row{display:flex;gap:5px;direction:ltr}
.star{font-size:22px;cursor:pointer;color:#ddd;transition:color 0.1s;user-select:none}
.star.active{color:#EF9F27}
.btn-export{width:100%;background:linear-gradient(135deg,#185FA5,#0C447C);color:#fff;border:none;border-radius:10px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:Arial;margin-bottom:8px;box-shadow:0 4px 12px rgba(24,95,165,0.3)}
.btn-clear{width:100%;background:#fff;color:#888;border:0.5px solid #ddd;border-radius:10px;padding:10px;font-size:12px;cursor:pointer;font-family:Arial}
.success-msg{background:#EAF3DE;border:0.5px solid #BBF7D0;border-radius:8px;padding:10px;font-size:12px;color:#14532D;display:none;text-align:center;margin-bottom:8px}
.error-msg{background:#FDECEA;border:0.5px solid #FECACA;border-radius:8px;padding:10px;font-size:12px;color:#8B1A1A;display:none;text-align:center;margin-bottom:8px}
.counter-badge{background:#185FA5;color:#fff;border-radius:10px;padding:1px 8px;font-size:10px;margin-right:6px}
</style>
</head>

function addComplaint() {
  complaintCount++;
  const id = 'c' + complaintCount;
  
  const typeOptions = Object.keys(COMPLAINT_TYPES).map(t => 
    `<option value="${t}">${COMPLAINT_TYPES[t].icon} ${t}</option>`
  ).join('');

  const div = document.createElement('div');
  div.className = 'complaint-section';
  div.id = id;
  div.innerHTML = `
    <div class="complaint-header" onclick="toggleComplaint('${id}')">
      <span class="complaint-type" id="title-${id}">شكوى جديدة</span>
      <button class="remove-btn" onclick="event.stopPropagation();removeComplaint('${id}')">✕</button>
    </div>
    <div class="complaint-body open" id="body-${id}">
      <div class="sub-field">
        <label>نوع المشكلة</label>
        <select id="type-${id}" onchange="updateComplaintFields('${id}')">
          <option value="">اختر نوع المشكلة</option>
          ${typeOptions}
        </select>
      </div>
      <div id="dynamic-fields-${id}"></div>
    </div>`;
  
  document.getElementById('complaints-list').appendChild(div);
  updateCounter();
}

function updateComplaintFields(id) {
  const type = document.getElementById('type-' + id).value;
  document.getElementById('title-' + id).textContent = type ? 
    COMPLAINT_TYPES[type].icon + ' ' + type : 'شكوى جديدة';
  
  if (!type) { document.getElementById('dynamic-fields-' + id).innerHTML = ''; return; }
  
  const fields = COMPLAINT_TYPES[type].fields;
  let html = '';
  fields.forEach(f => {
    html += `<div class="sub-field"><label>${f.label}</label>`;
    if (f.type === 'select') {
      html += `<select id="${f.id}-${id}"><option value="">اختر</option>`;
      f.options.forEach(o => html += `<option value="${o}">${o}</option>`);
      html += '</select>';
    } else if (f.type === 'textarea') {
      html += `<textarea id="${f.id}-${id}" placeholder="${f.placeholder||''}"></textarea>`;
    } else {
      html += `<input type="text" id="${f.id}-${id}" placeholder="${f.placeholder||''}"/>`;
    }
    html += '</div>';
  });
  document.getElementById('dynamic-fields-' + id).innerHTML = html;
}

function toggleComplaint(id) {
  const body = document.getElementById('body-' + id);
  body.classList.toggle('open');
}

function removeComplaint(id) {
  document.getElementById(id).remove();
  updateCounter();
}

function updateCounter() {
  const count = document.getElementById('complaints-list').children.length;
  document.getElementById('complaints-counter').textContent = count;
}

function getComplaintsData() {
  const items = document.getElementById('complaints-list').children;
  const result = [];
  for (let item of items) {
    const id = item.id;
    const type = document.getElementById('type-' + id)?.value;
    if (!type) continue;
    const fields = COMPLAINT_TYPES[type]?.fields || [];
    const entry = { type };
    fields.forEach(f => {
      const el = document.getElementById(f.id + '-' + id);
      if (el) entry[f.id] = el.value;
    });
    result.push(entry);
  }
  return result;
}

}
